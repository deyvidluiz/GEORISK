<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GeoRisk</title>

    <link rel="stylesheet" href="../node_modules/leaflet/dist/leaflet.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="topbar">
        <div>
            <span class="eyebrow">Monitoramento internacional</span>
            <h1>GeoRisk</h1>
        </div>
        <span class="status-dot">Mapa de conflitos</span>
    </header>

    <main>
        <div id="map"></div>

        <div id="painel">
            <div id="alerta-conflito">
                <strong id="alerta-tipo"></strong>
                <p id="alerta-resumo"></p>
            </div>

            <h2 id="nome-pais">Selecione um país</h2>
            <p><strong>Capital:</strong> <span id="capital"></span></p>
            <p><strong>Região:</strong> <span id="regiao"></span></p>
            <p><strong>População:</strong> <span id="populacao"></span></p>
            <p><strong>Código:</strong> <span id="codigo"></span></p>

            <label for="seletor-ano">Ano:</label>
            <select id="seletor-ano"></select>

            <div class="ai-bloco">
                <h3>Converse com a IA sobre este país</h3>
                <div id="chat-mensagens" style="height:180px; overflow-y:auto; background:#111; padding:8px; border-radius:6px; margin-bottom:8px; font-size:14px;"></div>
                <input type="text" id="chat-input" placeholder="Pergunte algo sobre este país..." style="width:70%;">
                <button id="chat-enviar">Enviar</button>
            </div>
        </div>
    </main>

    <script src="../node_modules/leaflet/dist/leaflet.js"></script>
    <script>
        var map = L.map('map', {
            maxBounds: [[-90, -180], [90, 180]],
            maxBoundsViscosity: 1.0,
            worldCopyJump: false
        });

        L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            noWrap: true,
            attribution: '&copy; <a href="http://www.openstreetmap.org/copyright">OpenStreetMap</a>'
        }).addTo(map);

        map.fitWorld();
        map.setZoom(map.getZoom() + 2);
    </script>

    <script src="script.js"></script>
</body>
</html>
